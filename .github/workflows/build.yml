name: build

on:
  push:
    branches: [ master, main, modernize ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build OSThreadDump.sln -c Release

      - name: Publish single-file exes
        run: |
          dotnet publish OSThreadDump/OSThreadDump.csproj -c Release -r win-x64 -o dist
          dotnet publish OSThreadDump/OSThreadDump.csproj -c Release -r win-x86 -o dist

      - name: Smoke test
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          dist/OSThreadDump.exe -?
          dist/OSThreadDump.exe -Process pwsh -Out smoke
          Get-Content smoke/*.log | Select-Object -First 40

      - uses: actions/upload-artifact@v4
        with:
          name: OSThreadDump
          path: |
            dist/OSThreadDump.exe
            dist/OSThreadDump.x86.exe
